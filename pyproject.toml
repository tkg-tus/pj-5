[project]
name = "highlight-project"
version = "0.1.0"
description = "動画の見どころ予測と切り抜き"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13.0",
    "numpy",
    "h5py",
    "fsspec[http]",
    "matplotlib",
    "scipy>=1.18.1",
    "pandas>=3.1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
